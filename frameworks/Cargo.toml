[package]
name = "frameworks"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
default = []
http = ["adapters/http", "dep:axum", "dep:tower-http"]
sqlite = ["adapters/sqlite", "dep:sqlx", "sqlx/sqlite"]
postgres = ["adapters/postgres", "dep:sqlx", "sqlx/postgres"]
mysql = ["adapters/mysql", "dep:sqlx", "sqlx/mysql"]

[[bin]]
name = "skel_rs"
path = "src/main.rs"

[dependencies]
adapters = { path = "../adapters", default-features = false }
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
sqlx = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tower = { workspace = true }
tempfile = { workspace = true }
