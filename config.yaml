pm3:
  home: "${PM3_HOME:-~/.pm3}"
  kill_timeout_ms: 1600
  start_timeout_ms: 5000
  drain_timeout_secs: 5
  daemon_poll_interval_ms: 50
  restart:
    min_uptime_ms: 1000
    max_restarts: 15
    restart_delay_ms: 0
  sandbox:
    mode: "workspace-write"
    network: false
  service:
    label: "com.enjoypi.pm3"
    search_path: "/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

telemetry:
  service_name: "pm3"
  log_level: "info"
  log_format: "json"
