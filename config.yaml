server:
  host: "0.0.0.0"
  port: 9229
  drain_timeout_secs: 20

health_check:
  host: "127.0.0.1"
  connect_timeout_secs: 2

telemetry:
  service_name: "skel_rs"
  log_level: "info"
  log_format: "json"

database:
  url: "${DATABASE_URL}"
  migrations_path: "./migrations"
  pool:
    max_connections: 10
    min_connections: 1
    acquire_timeout_secs: 5
    idle_timeout_secs: 300
    max_lifetime_secs: 1800
    health_check_timeout_secs: 3
