pm3:
  home: "${PM3_HOME:-~/.pm3}"
  cfg_dir: "${PM3_CFG_DIR:-~/.config/pm3}"
  search_path: "${PM3_SEARCH_PATH:-/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin}"
  stop_signal: "TERM"
  kill_timeout_ms: 1600
  start_timeout_ms: 5000
  drain_timeout_secs: 5
  request_timeout_ms: 30000
  command_timeout_ms: 5000
  daemon_poll_interval_ms: 50
  daemon_poll_max_interval_ms: 1000
  memory_poll_interval_ms: 30000
  log_follow_interval_ms: 200
  log_tail_lines: 20
  log_rotate_max_bytes: 0
  log_rotate_interval_ms: 60000
  ready_timeout_ms: 30000
  ready_poll_interval_ms: 200
  daemon_channel_depth: 32
  request_body_limit_bytes: 131072
  restart:
    autorestart: true
    min_uptime_ms: 1000
    max_restarts: 15
    restart_delay_ms: 0
    max_restart_delay_ms: 15000
  sandbox:
    mode: "workspace-write"
    read: "minimal"
    network: false
    seatbelt_program: "${PM3_SEATBELT_PROGRAM:-/usr/bin/sandbox-exec}"
    bwrap_program: "${PM3_BWRAP_PROGRAM:-bwrap}"
    minimal_read_roots:
      - "/bin"
      - "/sbin"
      - "/usr"
      - "/etc"
      - "/lib"
      - "/lib64"
      - "/opt/homebrew"
      - "/nix/store"
      - "/run/current-system/sw"
    forbidden_writable_roots:
      - "/"
      - "/bin"
      - "/boot"
      - "/dev"
      - "/etc"
      - "/lib"
      - "/proc"
      - "/sbin"
      - "/sys"
      - "/usr"
      - "/var"
  service:
    label: "com.enjoypi.pm3"
    restart_delay_secs: 2
    restart_condition: "always"
    max_tasks: 4096
    cpu_quota_percent: 0
    wait_for_network: false
    launchctl_path: "${PM3_LAUNCHCTL_PATH:-/bin/launchctl}"
    systemctl_path: "${PM3_SYSTEMCTL_PATH:-/usr/bin/systemctl}"
    loginctl_path: "${PM3_LOGINCTL_PATH:-/usr/bin/loginctl}"
    schtasks_path: "${PM3_SCHTASKS_PATH:-schtasks}"

telemetry:
  service_name: "pm3"
  log_level: "info"
  log_format: "json"
