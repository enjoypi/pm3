name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: check the tag matches the workspace version
        run: |
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match workspace version ${cargo_version}"
            exit 1
          fi

      - name: build
        run: |
          cargo build --locked --release -p frameworks
          strip target/release/pm3

      - name: sign the macOS binary with the stable pm3-local identity
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          PM3_CODESIGN_P12: ${{ secrets.PM3_CODESIGN_P12 }}
          PM3_CODESIGN_P12_PASSWORD: ${{ secrets.PM3_CODESIGN_P12_PASSWORD }}
        run: |
          if [ -z "$PM3_CODESIGN_P12" ]; then
            echo "secrets.PM3_CODESIGN_P12 未配置，产物保持 ad-hoc 签名（TCC 授权随 cdhash 失效）"
            exit 0
          fi
          echo "$PM3_CODESIGN_P12" | base64 --decode > /tmp/pm3-local.p12
          security create-keychain -p ci-pm3 /tmp/pm3-ci.keychain-db
          security set-keychain-settings -lut 21600 /tmp/pm3-ci.keychain-db
          security unlock-keychain -p ci-pm3 /tmp/pm3-ci.keychain-db
          security import /tmp/pm3-local.p12 -k /tmp/pm3-ci.keychain-db -P "$PM3_CODESIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-pm3 /tmp/pm3-ci.keychain-db
          security list-keychains -d user -s /tmp/pm3-ci.keychain-db $(security list-keychains -d user | tr -d '"')
          codesign --force --sign "pm3-local" --identifier com.enjoypi.pm3 target/release/pm3
          rm -f /tmp/pm3-local.p12

      - name: package
        run: |
          mkdir -p dist/stage
          cp target/release/pm3 LICENSE config.yaml dist/stage/
          tar -czf "dist/pm3-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" -C dist/stage pm3 LICENSE config.yaml
          (cd dist && shasum -a 256 "pm3-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" > "pm3-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: pm3-${{ matrix.target }}
          path: dist/*.tar.gz*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: check the tag matches the workspace version
        run: |
          $cargoVersion = (Select-String -Path Cargo.toml -Pattern '^version' | Select-Object -First 1).Line.Split('"')[1]
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          if ($cargoVersion -ne $tagVersion) {
            Write-Error "tag ${{ github.ref_name }} does not match workspace version $cargoVersion"
          }

      - name: build
        run: cargo build --locked --release -p frameworks

      - name: package
        run: |
          New-Item -ItemType Directory -Force dist\stage | Out-Null
          Copy-Item target\release\pm3.exe, LICENSE, config.yaml dist\stage\
          $zip = "dist\pm3-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip"
          Compress-Archive -Path dist\stage\* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$zip.sha256", "$hash  $(Split-Path $zip -Leaf)")

      - uses: actions/upload-artifact@v4
        with:
          name: pm3-x86_64-pc-windows-msvc
          path: dist/*.zip*

  windows-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: Swatinem/rust-cache@v2

      - name: e2e
        run: cargo nextest run --locked --workspace --release
        timeout-minutes: 30

  release:
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: pm3-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz*
            dist/*.zip*
          generate_release_notes: true
          body: |
            ## 安装

            一行装（校验 sha256、落 `~/bin/pm3`、自动 `pm3 install` 注册开机自启）：

            ```sh
            curl -fsSL https://raw.githubusercontent.com/enjoypi/pm3/main/install.sh | sh
            ```

            手动安装：

            1. 下载对应平台的 tar.gz 与同名 `.sha256`，校验：`shasum -a 256 -c pm3-<版本>-<平台>.tar.gz.sha256`（Linux 用 `sha256sum -c`）
            2. 解开：`tar xzf pm3-<版本>-<平台>.tar.gz`（内含 `pm3`、`LICENSE`、`config.yaml`）
            3. 首次安装：把 `pm3` 与 `config.yaml` 放同一目录后跑 `./pm3 --config ./config.yaml install`（默认配置会被落进 `~/.pm3/config.yaml`，二进制落 `~/bin/pm3`）
            4. 升级：直接跑 `pm3 install`（读既有配置，备份旧版、原子落位、重装自启）

            macOS：产物以 pm3-local 自签名证书签名（与 `just signing-identity` 同一把，TCC 授权跨版本稳定）；浏览器下载的首次运行前 `xattr -d com.apple.quarantine pm3`（curl 下载不带 quarantine 属性可跳过）。

            Windows（PowerShell，不使用 .sh）：

            ```powershell
            $tag = (Invoke-RestMethod https://api.github.com/repos/enjoypi/pm3/releases/latest).tag_name
            $zip = "pm3-$tag-x86_64-pc-windows-msvc.zip"
            Invoke-WebRequest "https://github.com/enjoypi/pm3/releases/download/$tag/$zip" -OutFile $zip
            Invoke-WebRequest "https://github.com/enjoypi/pm3/releases/download/$tag/$zip.sha256" -OutFile "$zip.sha256"
            $expected = (Get-Content "$zip.sha256" -Raw).Split(' ')[0]
            if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw "sha256 校验失败" }
            Expand-Archive $zip -DestinationPath pm3
            .\pm3\pm3.exe --config .\pm3\config.yaml install   # 首次安装
            pm3 install                                        # 之后的升级
            ```

            ## 运行时依赖

            - `/bin/ps` 与 `/bin/kill`（procps）：缺了每次 daemon 重启所有服务都会被判探测失败而驱逐重启
            - Linux 沙箱需要 `bwrap`（bubblewrap）：缺了沙箱模式起不来
